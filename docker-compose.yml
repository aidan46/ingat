services:
  postgres:
    image: postgres:16
    container_name: ingat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ingat
      POSTGRES_PASSWORD: ingat
      POSTGRES_DB: ingat
    ports:
      - "5432:5432"
    volumes:
      - ingat-pgdata:/var/lib/postgresql/data

volumes:
  ingat-pgdata:
